# ═══════════════════════════════════════════════════════════════
# Syria Dashboard — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════
# يتضمن:
#   - Proxy Server (Node.js)
#   - Nginx Reverse Proxy
#   - Let's Encrypt (SSL)
#   - Redis Cache (اختياري)
#
# الاستخدام:
#   docker-compose -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syria-dashboard-proxy
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SPREADSHEET_ID=${SPREADSHEET_ID}
      - SHEET_RANGE=${SHEET_RANGE:-سوريا!A1:ZZ5000}
      - CACHE_TTL_SECONDS=300
      - RATE_LIMIT_MAX=100
      - CORS_ORIGIN=${CORS_ORIGIN:-https://yourdomain.com}
      - TRUST_PROXY=true
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - syria-dashboard-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: syria-dashboard-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/syria-dashboard/public:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - syria-dashboard-net
    depends_on:
      - proxy
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'"

  certbot:
    image: certbot/certbot
    container_name: syria-dashboard-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - syria-dashboard-net

  # Redis Cache (اختياري — للإنتاج الكبير)
  redis:
    image: redis:7-alpine
    container_name: syria-dashboard-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - syria-dashboard-redis-net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

networks:
  syria-dashboard-net:
    driver: bridge
  syria-dashboard-redis-net:
    driver: bridge

volumes:
  redis-data:
