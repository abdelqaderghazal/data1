# ═══════════════════════════════════════════════════════════════
# Syria Dashboard — Docker Compose (Development)
# ═══════════════════════════════════════════════════════════════
# الاستخدام: docker-compose up
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syria-dashboard-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SPREADSHEET_ID=${SPREADSHEET_ID:-1gbP938zd_pO3qfYRG4Yd7LmH7MOSbeyvuwjq0Tnnnds}
      - SHEET_RANGE=${SHEET_RANGE:-سوريا!A1:ZZ5000}
      - CACHE_TTL_SECONDS=300
      - RATE_LIMIT_MAX=1000
      - CORS_ORIGIN=*
    volumes:
      # تحميل .env من الجهاز المضيف
      - ./.env:/app/.env:ro
      # مجلد البيانات الاحتياطية
      - ./data:/app/data:ro
      # logs
      - ./logs:/app/logs
    networks:
      - syria-dashboard-net

  # اختياري: Redis للكاش المتقدم (بدلاً من node-cache)
  # redis:
  #   image: redis:7-alpine
  #   container_name: syria-dashboard-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - syria-dashboard-net

networks:
  syria-dashboard-net:
    driver: bridge

