<script>
'use strict';

/* ═══════════════════════════════════════════
   1) الإعدادات العامة
═══════════════════════════════════════════ */
const CONFIG = {
  // ضع رابط ملف CSV الفعلي هنا (Google Sheets مُصدَّر أو رابط مباشر)
  CSV_URL: 'https://raw.githubusercontent.com/YOUR_REPO/data.csv',
  STORAGE_KEY: 'syria_dash_data_v2',
  TARGETS_KEY: 'syria_dash_targets_v2',
  USERS_KEY:   'syria_dash_users_v2',
  SESSION_KEY: 'syria_dash_session_v2',
  DEMO_MODE: true  // بيانات تجريبية عند فشل الجلب (يحل مشكلة file://)
};

const GOVERNORATES = ['دمشق','ريف دمشق','حلب','حمص','حماه','اللاذقية',
  'طرطوس','السويداء','درعا','القنيطرة','ادلب','الرقة','دير الزور','الحسكة'];

const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران',
  'تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

/* ═══════════════════════════════════════════
   2) نظام الإشعارات الموحّد (بديل التكرار)
═══════════════════════════════════════════ */
function ensureToastContainer() {
  let c = document.getElementById('toast-container');
  if (!c) {
    c = document.createElement('div');
    c.id = 'toast-container';
    c.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:10px;';
    document.body.appendChild(c);
    const style = document.createElement('style');
    style.textContent = `
      .toast{padding:14px 22px;border-radius:12px;color:#fff;font-family:inherit;
        font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;
        gap:12px;animation:toastIn .3s ease;max-width:90vw}
      .toast.success{background:#0d7a4f}.toast.error{background:#c0392b}
      .toast.info{background:#1f6fb2}.toast.warning{background:#b7791f}
      .toast button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
      .toast.fade-out{opacity:0;transition:opacity .3s}
      @keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}`;
    document.head.appendChild(style);
  }
  return c;
}

function showToast(msg, type = 'info', duration = 3500) {
  const c = ensureToastContainer();
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${msg}</span><button aria-label="إغلاق">×</button>`;
  t.querySelector('button').onclick = () => t.remove();
  c.appendChild(t);
  setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 300); }, duration);
}

/* ═══════════════════════════════════════════
   3) التخزين الدائم (localStorage)
═══════════════════════════════════════════ */
const Store = {
  save(rows) {
    try {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({ rows, ts: Date.now() }));
      return true;
    } catch (e) { console.error('فشل الحفظ:', e); showToast('⚠️ فشل الحفظ المحلي', 'warning'); return false; }
  },
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  },
  lastUpdate() {
    const d = this.load();
    return d ? new Date(d.ts).toLocaleString('ar-SY') : null;
  }
};

/* ═══════════════════════════════════════════
   4) محلّل CSV الآمن (فاصلة عربية/إنجليزية/تاب)
═══════════════════════════════════════════ */
function detectDelimiter(line) {
  const candidates = { '،': (line.match(/،/g)||[]).length, ',': (line.match(/,/g)||[]).length, '\t': (line.match(/\t/g)||[]).length, ';': (line.match(/;/g)||[]).length };
  return Object.entries(candidates).sort((a,b) => b[1]-a[1])[0][0];
}

function parseCSV(text) {
  const clean = text.replace(/\r/g, '').trim();
  if (!clean) return { ok:false, error:'الملف فارغ' };

  const lines = clean.split('\n').filter(l => l.trim());
  if (lines.length < 2) return { ok:false, error:'يجب أن يحتوي الملف على صف عناوين وصف بيانات واحد على الأقل' };

  const delim = detectDelimiter(lines[0]);
  const headers = lines[0].split(delim).map(h => h.trim().replace(/^"|"$/g,''));

  const rows = lines.slice(1).map(line => {
    const cells = line.split(delim).map(c => c.trim().replace(/^"|"$/g,''));
    const obj = {};
    headers.forEach((h, i) => obj[h] = cells[i] ?? '');
    return obj;
  });

  return { ok:true, headers, rows };
}

/* التحقق من الأعمدة المطلوبة */
function validateRows(rows) {
  if (!rows.length) return { ok:false, error:'لا توجد صفوف بيانات' };
  const required = ['المحافظة', 'الشهر'];
  const sample = Object.keys(rows[0]);
  const missing = required.filter(r => !sample.some(k => k.includes(r)));
  if (missing.length) return { ok:false, error:`أعمدة مفقودة: ${missing.join(' ، ')}` };
  return { ok:true };
}

/* توحيد القيم */
function normalizeRow(r) {
  const get = key => {
    const k = Object.keys(r).find(k => k.includes(key));
    return k ? String(r[k]).trim() : '';
  };
  const num = key => {
    const v = parseFloat(get(key).replace(/[,٬\s]/g,''));
    return isNaN(v) ? 0 : v;
  };
  return {
    gov:   get('المحافظة'),
    month: get('الشهر'),
    values: Object.fromEntries(Object.keys(r).map(k => [k, isNaN(parseFloat(String(r[k]).replace(/[,٬]/g,''))) ? String(r[k]) : parseFloat(String(r[k]).replace(/[,٬]/g,''))]))
  };
}

/* ═══════════════════════════════════════════
   5) المصادقة الآمنة (تجزئة SHA-256)
═══════════════════════════════════════════ */
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function initUsers() {
  if (localStorage.getItem(CONFIG.USERS_KEY)) return;
  const users = {
    admin:  await sha256('admin123'),   // ← غيّرها فوراً بعد أول دخول
    viewer: await sha256('viewer123')
  };
  localStorage.setItem(CONFIG.USERS_KEY, JSON.stringify(users));
}

async function login(role, password) {
  const users = JSON.parse(localStorage.getItem(CONFIG.USERS_KEY) || '{}');
  const hash = await sha256(password);
  if (users[role] === hash) {
    sessionStorage.setItem(CONFIG.SESSION_KEY, role);
    return true;
  }
  return false;
}

function currentRole() { return sessionStorage.getItem(CONFIG.SESSION_KEY); }
function logout() { sessionStorage.removeItem(CONFIG.SESSION_KEY); location.reload(); }

/* ═══════════════════════════════════════════
   6) تعريف الأقسام (Registry) — حل مشكلة التكرار
═══════════════════════════════════════════ */
const SECTIONS = [
  { id:'sec-disability', title:'رعاية ذوي الإعاقة', keys:['إعاقة','بطاقات الإعاقة','تأهيل'] },
  { id:'sec-social',     title:'الرعاية الاجتماعية', keys:['مسنون','أيتام','كفالة','متسولون'] },
  { id:'sec-ngo',        title:'المنظمات غير الحكومية', keys:['منظمة','مشهرة','ندوة'] },
  { id:'sec-juvenile',   title:'معاهد إصلاح الأحداث', keys:['أحداث','نزيل','معهد'] },
  { id:'sec-rural',      title:'التنمية الريفية', keys:['ريفية','مركز','وحدة'] },
  { id:'sec-inspection', title:'التفتيش العمالي', keys:['تفتيش','مخالفة','زيارة'] },
  { id:'sec-labor',      title:'سوق العمل والبطالة', keys:['عامل','بطالة','مشتغل','متعطل'] },
  { id:'sec-insurance',  title:'التأمينات الاجتماعية', keys:['تأمين','متقاعد','مسجّل'] },
  { id:'sec-relief',     title:'المساعدات الإنسانية', keys:['سلة','مساعد','إعان'] },
  { id:'sec-camps',      title:'المخيمات والنازحون', keys:['مخيم','نازح','أسر'] },
  { id:'sec-platform',   title:'منصة سوق العمل الرقمية', keys:['منصة','فرص','منشأة'] },
  { id:'sec-demo',       title:'المؤشرات الديموغرافية', keys:['سكان','ذكر','إناث'] }
];

/* الحالة العامة */
const STATE = { rows: [], filterGov:'الكل', filterMonth:'الكل' };

/* ═══════════════════════════════════════════
   7) محرك العرض الموحّد
═══════════════════════════════════════════ */
function getFiltered() {
  return STATE.rows.filter(r =>
    (STATE.filterGov === 'الكل' || r.gov === STATE.filterGov) &&
    (STATE.filterMonth === 'الكل' || r.month === STATE.filterMonth)
  );
}

function findSectionRows(rows, keys) {
  if (!rows.length) return [];
  const cols = Object.keys(rows[0].values);
  const matched = cols.filter(c => keys.some(k => c.includes(k)));
  if (!matched.length) return [];
  return matched.map(col => ({
    label: col,
    total: rows.reduce((s,r) => s + (typeof r.values[col]==='number' ? r.values[col] : 0), 0)
  }));
}

function renderSection(sec, rows) {
  const el = document.getElementById(sec.id);
  if (!el) return;
  const body = el.querySelector('.section-body') || el;

  const metrics = findSectionRows(rows, sec.keys);
  if (!metrics.length) {
    body.innerHTML = `<div class="empty-state">📭 لا توجد بيانات متعلقة بهذا القسم في الملف الحالي</div>`;
    return;
  }

  body.innerHTML = `<div class="metrics-grid">${
    metrics.map(m => `
      <div class="metric-card">
        <div class="metric-value">${m.total.toLocaleString('ar-SY')}</div>
        <div class="metric-label">${m.label}</div>
      </div>`).join('')
  }</div>`;
}

function renderCompass(rows) {
  const el = document.getElementById('compass-body');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<div class="empty-state">📭 لا توجد بيانات للخطة الاستراتيجية</div>'; return; }
  // مقارنة إجمالي أول مؤشرين بهدف افتراضي (يمكن ربطها بأهداف محفوظة)
  const targets = JSON.parse(localStorage.getItem(CONFIG.TARGETS_KEY) || '{}');
  const metrics = findSectionRows(rows, Object.keys(targets).length ? Object.keys(targets) : ['إجمالي']);
  el.innerHTML = metrics.map(m => {
    const target = targets[m.label] || 0;
    const pct = target ? Math.min(100, Math.round(m.total/target*100)) : 0;
    const status = pct >= 75 ? '✅' : pct >= 40 ? '⚠️' : '🔴';
    return `<div class="goal-row">
      <span>${status} ${m.label}</span>
      <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span>${pct}%</span>
    </div>`;
  }).join('');
}

function renderAll() {
  const rows = getFiltered();
  SECTIONS.forEach(sec => renderSection(sec, rows));
  renderCompass(rows);

  // رسالة واحدة عامة بدلاً من 11 رسالة
  const banner = document.getElementById('global-data-banner');
  if (banner) {
    banner.style.display = rows.length ? 'none' : 'block';
    if (!rows.length) banner.innerHTML = '📁 لا توجد بيانات — ارفع ملف CSV أو استخدم الرابط الخارجي';
  }

  const lu = document.getElementById('lastUpdate');
  if (lu) lu.textContent = `آخر تحديث: ${Store.lastUpdate() || '—'}`;
}

/* ═══════════════════════════════════════════
   8) معالجة رفع / لصق / جلب البيانات
═══════════════════════════════════════════ */
function loadData(text, source = 'يدوي') {
  const parsed = parseCSV(text);
  if (!parsed.ok) { showToast(`❌ ${parsed.error}`, 'error'); return false; }

  const valid = validateRows(parsed.rows);
  if (!valid.ok) { showToast(`❌ ${valid.error}`, 'error'); return false; }

  STATE.rows = parsed.rows.map(normalizeRow).filter(r => r.gov);
  Store.save(STATE.rows);
  renderAll();
  showToast(`✅ تم تحميل ${STATE.rows.length} سجلاً (${source})`, 'success');
  return true;
}

async function autoFetch() {
  try {
    const res = await fetch(CONFIG.CSV_URL, { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    loadData(await res.text(), 'الرابط الخارجي');
  } catch {
    const saved = Store.load();
    if (saved?.rows?.length) {
      STATE.rows = saved.rows;
      renderAll();
      showToast('📵 لا يوجد اتصال — تم تحميل البيانات المحفوظة محلياً', 'warning');
    } else if (CONFIG.DEMO_MODE) {
      STATE.rows = demoData();
      renderAll();
      showToast('🧪 يتم عرض بيانات تجريبية — ارفع ملفك الفعلي', 'info', 5000);
    }
  }
}

/* بيانات تجريبية (تُحل مشكلة file:// فوراً) */
function demoData() {
  const out = [];
  GOVERNORATES.slice(0,5).forEach((g,gi) => MONTHS.slice(0,3).forEach((m,mi) => {
    out.push(normalizeRow({
      'المحافظة': g, 'الشهر': m,
      'بطاقات الإعاقة': 120 + gi*30 + mi*10,
      'المسنون المستفيدون': 80 + gi*15,
      'المنظمات المشهرة': 12 + gi*2,
      'نزلاء الأحداث': 25 + gi*5,
      'مراكز التنمية الريفية': 8 + gi,
      'زيارات التفتيش': 200 + gi*40 + mi*20,
      'عدد المشتغلين': 5000 + gi*800,
      'المسجلون في التأمينات': 3000 + gi*500,
      'السلل الغذائية': 900 + gi*150,
      'أسر المخيمات': 400 + gi*90,
      'المسجلون في المنصة': 600 + gi*120,
      'عدد السكان': 500000 + gi*100000
    }));
  }));
  return out;
}

/* ═══════════════════════════════════════════
   9) ربط الأحداث
═══════════════════════════════════════════ */
function bindEvents() {
  // تسجيل الدخول
  document.getElementById('loginBtn')?.addEventListener('click', async () => {
    const role = document.getElementById('roleSelect')?.value || 'viewer';
    const pass = document.getElementById('passwordInput')?.value || '';
    if (await login(role, pass)) {
      showToast('✅ تم الدخول بنجاح', 'success');
      document.getElementById('loginScreen')?.classList.add('hidden');
      document.getElementById('dashboard')?.classList.remove('hidden');
      if (role === 'viewer') showToast('👁️ أنت في وضع القراءة فقط', 'info');
      renderAll();
    } else {
      showToast('❌ كلمة المرور غير صحيحة', 'error');
    }
  });

  // تسجيل الخروج
  document.querySelectorAll('[data-logout]').forEach(b => b.addEventListener('click', logout));

  // رفع الملف
  const fileInput = document.getElementById('csvFileInput');
  fileInput?.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => loadData(ev.target.result, `ملف ${f.name}`);
    reader.onerror = () => showToast('❌ تعذّرت قراءة الملف', 'error');
    reader.readAsText(f, 'utf-8');
  });

  // السحب والإفلات
  const dz = document.getElementById('dropZone');
  if (dz) {
    ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag-over'); }));
    ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag-over'); }));
    dz.addEventListener('drop', e => {
      const f = e.dataTransfer.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => loadData(ev.target.result, `ملف ${f.name}`);
      reader.readAsText(f, 'utf-8');
    });
  }

  // اللصق المباشر
  document.getElementById('parsePasteBtn')?.addEventListener('click', () => {
    const txt = document.getElementById('pasteArea')?.value;
    if (!txt?.trim()) { showToast('⚠️ الصق البيانات أولاً', 'warning'); return; }
    loadData(txt, 'بيانات ملصقة');
  });

  // التحديث من الرابط
  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    showToast('🔄 جاري التحديث...', 'info', 1500);
    autoFetch();
  });

  // التصفية
  document.getElementById('govFilter')?.addEventListener('change', e => { STATE.filterGov = e.target.value; renderAll(); });
  document.getElementById('monthFilter')?.addEventListener('change', e => { STATE.filterMonth = e.target.value; renderAll(); });
}

/* ═══════════════════════════════════════════
   10) التهيئة عند فتح الصفحة
═══════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async () => {
  await initUsers();
  bindEvents();

  // جلسة محفوظة؟
  if (currentRole()) {
    document.getElementById('loginScreen')?.classList.add('hidden');
    document.getElementById('dashboard')?.classList.remove('hidden');
  }
  autoFetch();
});
</script>
